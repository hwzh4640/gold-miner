name = "gold-miner-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
# Comma-separated list of origins allowed to open rooms. Localhost is always allowed.
ALLOWED_ORIGINS = "https://pages.hz.ax,https://hwzh4640.github.io"

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
